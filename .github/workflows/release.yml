name: Build and publish installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: aiof-linux-x86_64.tar.gz
          - os: windows-latest
            artifact: aiof-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux GTK and packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libvlc-dev vlc-plugin-base vlc-plugin-video-output
      - name: Test
        run: go test ./...
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: make package-linux
      - name: Build Windows package
        if: runner.os == 'Windows'
        run: make package-windows
      - uses: actions/upload-artifact@v4
        with:
          name: aiof-${{ runner.os }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
